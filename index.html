<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stockroom Dashboard</title>
<style>
  :root {
    --bg: #f3f5f8;
    --surface: #ffffff;
    --ink: #17202e;
    --muted: #6a7587;
    --line: #dfe4ec;
    --accent: #1f4fd8;
    --accent-ink: #ffffff;
    --warn: #b45309;
    --warn-bg: #fdf0dc;
    --ok: #17734a;
    --ok-bg: #dff3e8;
    --danger: #b3261e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    line-height: 1.5;
  }
  header {
    background: var(--ink); color: #fff; padding: 18px 32px;
    display: flex; align-items: center; justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 1.25rem; font-weight: 650; letter-spacing: .2px; }
  header span { color: #aab4c5; font-size: .9rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 20px 60px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; }
  .stat {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px 18px;
  }
  .stat .label { color: var(--muted); font-size: .85rem; }
  .stat .value { font-size: 1.9rem; font-weight: 700; margin-top: 2px; }
  .stat.alert .value { color: var(--warn); }

  .cats { margin: 18px 0 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; color: var(--muted); font-size: .88rem; }
  .cats b { color: var(--ink); font-weight: 600; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
    padding: 3px 12px; font-size: .85rem; color: var(--ink); cursor: pointer;
  }
  .chip:hover { border-color: var(--accent); }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-top: 22px; }
  .toolbar { display: flex; gap: 12px; padding: 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .toolbar input[type=search] { flex: 1; min-width: 200px; }

  input, select {
    font: inherit; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; color: var(--ink); width: 100%;
  }
  input:focus, button:focus-visible, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  button {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 8px;
    padding: 9px 16px; border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { filter: brightness(1.1); }
  button.small { padding: 5px 11px; font-size: .85rem; }
  button.danger { color: var(--danger); }
  button.danger:hover { background: #fdecea; border-color: var(--danger); }

  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: .82rem; color: var(--muted); font-weight: 600; background: #fafbfd; }
  td.num, th.num { text-align: right; }
  tr:last-child td { border-bottom: none; }
  td.actions { text-align: right; }
  td.actions button + button { margin-left: 6px; }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.low { background: var(--warn-bg); color: var(--warn); }

  .empty { padding: 40px 16px; text-align: center; color: var(--muted); }

  /* Modal */
  dialog {
    border: none; border-radius: 12px; padding: 0; width: min(440px, 92vw);
    box-shadow: 0 20px 60px rgba(10, 20, 40, .3);
  }
  dialog::backdrop { background: rgba(15, 25, 45, .5); }
  dialog form { padding: 24px; display: grid; gap: 14px; }
  dialog h2 { margin: 0 0 4px; font-size: 1.15rem; }
  label { display: grid; gap: 5px; font-size: .88rem; font-weight: 600; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 6px; }
  .form-error { color: var(--danger); font-size: .88rem; min-height: 1.2em; margin: 0; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--ink); color: #fff; padding: 11px 20px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: .25s;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header>
  <h1>Stockroom</h1>
  <span>Inventory dashboard</span>
</header>

<main>
  <section class="stats" aria-label="Summary">
    <div class="stat"><div class="label">Products</div><div class="value" id="statProducts">–</div></div>
    <div class="stat"><div class="label">Units in stock</div><div class="value" id="statUnits">–</div></div>
    <div class="stat"><div class="label">Inventory value</div><div class="value" id="statValue">–</div></div>
    <div class="stat alert"><div class="label">Low stock (10 or fewer)</div><div class="value" id="statLow">–</div></div>
  </section>

  <div class="cats" id="cats"></div>

  <section class="panel">
    <div class="toolbar">
      <input type="search" id="search" placeholder="Search by name or category">
      <button class="primary" id="addBtn">Add product</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th><th>Category</th>
            <th class="num">Price</th><th class="num">Quantity</th>
            <th>Status</th><th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="empty" hidden>No products found. Click “Add product” to create one.</div>
  </section>
</main>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2 id="dlgTitle">Add product</h2>
    <input type="hidden" id="pid">
    <label>Name <input id="name" required maxlength="80"></label>
    <label>Category <input id="category" required maxlength="40" list="catList"></label>
    <datalist id="catList"></datalist>
    <div class="row">
      <label>Price <input id="price" type="number" min="0" step="0.01" required></label>
      <label>Quantity <input id="quantity" type="number" min="0" step="1" required></label>
    </div>
    <p class="form-error" id="formError"></p>
    <div class="form-actions">
      <button type="button" id="cancelBtn">Cancel</button>
      <button type="submit" class="primary" id="saveBtn">Save product</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const money = (n) => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

let products = [];

async function api(url, options = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Something went wrong.');
  return data;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ----- READ -----
async function loadStats() {
  const s = await api('/api/stats');
  $('statProducts').textContent = s.totalProducts;
  $('statUnits').textContent = s.totalUnits.toLocaleString();
  $('statValue').textContent = money(s.inventoryValue);
  $('statLow').textContent = s.lowStock;

  $('cats').innerHTML = s.byCategory.length
    ? '<b>Categories:</b> ' + s.byCategory.map(c =>
        `<button class="chip" data-cat="${esc(c.category)}">${esc(c.category)} (${c.count})</button>`).join('')
    : '';
  $('catList').innerHTML = s.byCategory.map(c => `<option value="${esc(c.category)}">`).join('');
}

async function loadProducts() {
  const q = encodeURIComponent($('search').value);
  products = await api('/api/products?search=' + q);
  $('rows').innerHTML = products.map(p => `
    <tr>
      <td>${esc(p.name)}</td>
      <td>${esc(p.category)}</td>
      <td class="num">${money(p.price)}</td>
      <td class="num">${p.quantity}</td>
      <td>${p.quantity <= 10
            ? '<span class="badge low">Low stock</span>'
            : '<span class="badge ok">In stock</span>'}</td>
      <td class="actions">
        <button class="small" data-edit="${p.id}">Edit</button>
        <button class="small danger" data-del="${p.id}">Delete</button>
      </td>
    </tr>`).join('');
  $('empty').hidden = products.length > 0;
}

const refresh = () => Promise.all([loadStats(), loadProducts()]);

// ----- CREATE / UPDATE -----
function openForm(product) {
  $('dlgTitle').textContent = product ? 'Edit product' : 'Add product';
  $('pid').value = product ? product.id : '';
  $('name').value = product ? product.name : '';
  $('category').value = product ? product.category : '';
  $('price').value = product ? product.price : '';
  $('quantity').value = product ? product.quantity : '';
  $('formError').textContent = '';
  $('dlg').showModal();
  $('name').focus();
}

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const id = $('pid').value;
  const body = {
    name: $('name').value,
    category: $('category').value,
    price: $('price').value,
    quantity: $('quantity').value,
  };
  try {
    if (id) {
      await api('/api/products/' + id, { method: 'PUT', body });
      toast('Product updated');
    } else {
      await api('/api/products', { method: 'POST', body });
      toast('Product added');
    }
    $('dlg').close();
    refresh();
  } catch (err) {
    $('formError').textContent = err.message;
  }
});

// ----- DELETE -----
async function removeProduct(id) {
  const p = products.find(x => x.id === id);
  if (!confirm(`Delete "${p.name}"? This cannot be undone.`)) return;
  await api('/api/products/' + id, { method: 'DELETE' });
  toast('Product deleted');
  refresh();
}

// ----- Events -----
$('addBtn').onclick = () => openForm(null);
$('cancelBtn').onclick = () => $('dlg').close();

$('rows').addEventListener('click', (e) => {
  const edit = e.target.closest('[data-edit]');
  const del = e.target.closest('[data-del]');
  if (edit) openForm(products.find(p => p.id === Number(edit.dataset.edit)));
  if (del) removeProduct(Number(del.dataset.del));
});

$('cats').addEventListener('click', (e) => {
  const chip = e.target.closest('[data-cat]');
  if (chip) { $('search').value = chip.dataset.cat; loadProducts(); }
});

let timer;
$('search').addEventListener('input', () => {
  clearTimeout(timer);
  timer = setTimeout(loadProducts, 200);
});

refresh();
</script>
</body>
</html>
